        <!-- Tabs -->
        <div class="flex gap-4 mb-8 border-b border-gray-300">
          <button onclick="switchTab('shipments')" id="tab-shipments" class="px-4 py-3 font-semibold text-primary border-b-2 border-primary">Shipments</button>
          <button onclick="switchTab('chats')" id="tab-chats" class="px-4 py-3 font-semibold text-gray-600 hover:text-primary">Live Chat Messages</button>
        </div>

        <!-- Shipments Tab -->
        <div id="shipments-tab">
          <!-- Create Shipment -->
          <div class="grid md:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
              <h2 class="text-2xl font-semibold mb-4">Create Shipment</h2>
              <form id="createShipmentForm" class="space-y-4">
                <input name="owner_name" required placeholder="Owner name" class="w-full p-2 border rounded" />
                <input name="owner_email" type="email" placeholder="Owner email (for notifications)" class="w-full p-2 border rounded" />
                <input name="company" placeholder="Company (optional)" class="w-full p-2 border rounded" />
                <textarea name="description" placeholder="Description" class="w-full p-2 border rounded"></textarea>
                
                <div class="grid grid-cols-2 gap-2">
                  <input name="origin" required placeholder="Origin city" class="w-full p-2 border rounded" />
                  <input name="destination" required placeholder="Destination city" class="w-full p-2 border rounded" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <input name="eta" type="date" class="w-full p-2 border rounded" />
                  <input name="weight" placeholder="Weight (kg)" class="w-full p-2 border rounded" />
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <select name="service" class="w-full p-2 border rounded">
                    <option value="">Select service</option>
                    <option value="air">Air Freight</option>
                    <option value="land">Land Freight</option>
                    <option value="express">Express Delivery</option>
                    <option value="corporate">Corporate & Bulk</option>
                  </select>
                </div>

                <p class="text-sm text-gray-600">Coordinates (optional for maps):</p>
                <div class="grid grid-cols-2 gap-2">
                  <input name="origin_lat" type="number" step="0.0001" placeholder="Origin lat" class="w-full p-2 border rounded" />
                  <input name="origin_lng" type="number" step="0.0001" placeholder="Origin lng" class="w-full p-2 border rounded" />
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <input name="dest_lat" type="number" step="0.0001" placeholder="Dest lat" class="w-full p-2 border rounded" />
                  <input name="dest_lng" type="number" step="0.0001" placeholder="Dest lng" class="w-full p-2 border rounded" />
                </div>

                <button type="submit" class="w-full bg-primary text-white py-2 rounded hover:bg-darkRed transition">Create Shipment</button>
                <p id="shipmentStatus" class="text-sm text-center"></p>
              </form>
            </div>

            <!-- Add Movement -->
            <div class="bg-white p-6 rounded-lg shadow-md">
              <h2 class="text-2xl font-semibold mb-4">Add Movement</h2>
              <form id="addMovementForm" class="space-y-4">
                <input name="tracking_code" required placeholder="Tracking code" class="w-full p-2 border rounded" />
                <input name="location" required placeholder="Location" class="w-full p-2 border rounded" />
                
                <div class="grid grid-cols-2 gap-2">
                  <input name="lat" type="number" step="0.0001" placeholder="Latitude" class="w-full p-2 border rounded" />
                  <input name="lng" type="number" step="0.0001" placeholder="Longitude" class="w-full p-2 border rounded" />
                </div>

                <select name="status" required class="w-full p-2 border rounded">
                  <option value="">Select status</option>
                  <option value="Picked up">Picked up</option>
                  <option value="In transit">In transit</option>
                  <option value="At hub">At hub</option>
                  <option value="Out for delivery">Out for delivery</option>
                  <option value="Delivered">Delivered</option>
                </select>

                <textarea name="note" placeholder="Note (optional)" class="w-full p-2 border rounded"></textarea>

                <button type="submit" class="w-full bg-primary text-white py-2 rounded hover:bg-darkRed transition">Add Movement</button>
                <p id="movementStatus" class="text-sm text-center"></p>
              </form>
            </div>
          </div>

          <!-- Recent Shipments -->
          <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Recent Shipments</h2>
            <div id="shipmentsList" class="space-y-4"></div>
          </div>
        </div>

        <!-- Chats Tab -->
        <div id="chats-tab" class="hidden">
          <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Live Chat Messages</h2>
            <div id="chatsList" class="space-y-4"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer bg-black text-white py-16 mt-12">
    <div class="container mx-auto text-center">
      <p>© 2026 CareConnect Courier. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/admin.js"></script>
</body>
</html>
