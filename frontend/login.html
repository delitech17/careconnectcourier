<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CareConnect Courier</title>
  <!-- Tailwind CDN -->
  <link rel="stylesheet" href="css/tailwind.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-lightBg text-gray-800">

    <header class="bg-white sticky top-0 z-50 shadow-md">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-darkRed">
        <i class="fas fa-truck-fast text-primary"></i> CareConnect <span class="text-primary">Courier</span>
      </a>

      <!-- Mobile Menu Toggle Button (Hamburger Icon) -->
      <button id="menuBtn" 
              class="md:hidden text-2xl cursor-pointer hover:text-primary transition duration-300 p-2 rounded-lg hover:bg-gray-100"
              aria-label="Toggle navigation menu"
              aria-expanded="false"
              aria-controls="mobileMenu">
        <i class="fas fa-bars"></i>
      </button>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex space-x-6 font-medium">
        <ul class="nav-links flex space-x-6">
          <li><a href="index.html" class="hover:text-primary transition">Home</a></li>
          <li><a href="tracking.html" class="hover:text-primary transition">Tracking</a></li>
        </ul>
      </nav>
    </div>

    <!-- Mobile Menu Overlay (Click to Close) -->
    <div id="menuOverlay" class="hidden fixed inset-0 bg-black opacity-50 md:hidden z-30 transition-opacity duration-300"></div>

    <!-- Mobile Navigation Menu -->
    <nav id="mobileMenu" 
         class="fixed top-0 left-0 h-screen w-64 bg-white shadow-2xl md:hidden z-40 transform -translate-x-full transition-transform duration-300 ease-out overflow-y-auto"
         aria-label="Mobile navigation">
      
      <!-- Menu Header with Close Button -->
      <div class="flex items-center justify-between p-6 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white">
        <span class="font-bold text-lg text-primary">Menu</span>
        <button id="closeMenuBtn" 
                class="text-2xl text-gray-600 hover:text-primary transition duration-300 p-1 rounded hover:bg-gray-100"
                aria-label="Close navigation menu">
          <i class="fas fa-times"></i>
        </button>
      </div>
      
      <!-- Menu Links -->
      <div class="py-4">
        <a href="index.html" 
           class="menu-link block px-6 py-4 text-gray-800 hover:bg-gray-50 hover:text-primary transition duration-200 border-l-4 border-transparent hover:border-primary">
          <i class="fas fa-home w-5 mr-3"></i>Home
        </a>
        <a href="tracking.html" 
           class="menu-link block px-6 py-4 text-gray-800 hover:bg-gray-50 hover:text-primary transition duration-200 border-l-4 border-transparent hover:border-primary">
          <i class="fas fa-map-location-dot w-5 mr-3"></i>Tracking
        </a>
      </div>
    </nav>
  </header>

    <section class="min-h-screen flex items-center justify-center py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-center mb-2">Welcome Back</h1>
        <p class="text-center text-gray-600 mb-8">Sign in to your account to view your shipments</p>

        <div id="authForm">
                    <div id="loginTab">
            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" name="email" required placeholder="your@email.com" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-darkRed transition">
                Sign In
              </button>
            </form>
            <p class="text-center text-gray-600 text-sm mt-6">
              Don't have an account? <a href="#" onclick="toggleTab()" class="text-primary font-semibold hover:underline">Create one</a>
            </p>
          </div>

                    <div id="registerTab" class="hidden">
            <form id="registerForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium mb-2">Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" name="email" required placeholder="your@email.com" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-darkRed transition">
                Create Account
              </button>
            </form>
            <p class="text-center text-gray-600 text-sm mt-6">
              Already have an account? <a href="#" onclick="toggleTab()" class="text-primary font-semibold hover:underline">Sign in</a>
            </p>
          </div>
        </div>

                <div id="authStatus" class="mt-4 p-3 rounded-lg text-center text-sm hidden"></div>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
</body>

</html>
