<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CareConnect Courier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b0000',
            darkRed: '#660000',
          }
        }
      }
    }
  </script>
</head>

<body class="bg-lightBg text-gray-800">

    <header class="bg-white sticky top-0 z-50 shadow-md">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-darkRed">
        <i class="fas fa-truck-fast text-primary"></i> CareConnect <span class="text-primary">Courier</span>
      </a>
      <nav class="hidden md:flex space-x-6 font-medium">
        <a href="index.html" class="hover:text-primary">Home</a>
        <a href="tracking.html" class="hover:text-primary">Tracking</a>
      </nav>
    </div>
  </header>

    <section class="min-h-screen flex items-center justify-center py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-center mb-2">Welcome Back</h1>
        <p class="text-center text-gray-600 mb-8">Sign in to your account to view your shipments</p>

        <div id="authForm">
                    <div id="loginTab">
            <form id="loginForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" name="email" required placeholder="your@email.com" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-darkRed transition">
                Sign In
              </button>
            </form>
            <p class="text-center text-gray-600 text-sm mt-6">
              Don't have an account? <a href="#" onclick="toggleTab()" class="text-primary font-semibold hover:underline">Create one</a>
            </p>
          </div>

                    <div id="registerTab" class="hidden">
            <form id="registerForm" class="space-y-4">
              <div>
                <label class="block text-sm font-medium mb-2">Full Name</label>
                <input type="text" name="name" required placeholder="John Doe" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Email</label>
                <input type="email" name="email" required placeholder="your@email.com" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <div>
                <label class="block text-sm font-medium mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-primary outline-none">
              </div>
              <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-darkRed transition">
                Create Account
              </button>
            </form>
            <p class="text-center text-gray-600 text-sm mt-6">
              Already have an account? <a href="#" onclick="toggleTab()" class="text-primary font-semibold hover:underline">Sign in</a>
            </p>
          </div>
        </div>

                <div id="authStatus" class="mt-4 p-3 rounded-lg text-center text-sm hidden"></div>
      </div>
    </div>
  </section>

  <script src="js/auth.js"></script>
</body>

</html>
