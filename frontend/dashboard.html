<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shipments | CareConnect Courier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8b0000',
            darkRed: '#660000',
          }
        }
      }
    }
  </script>
</head>

<body class="bg-gray-100 text-gray-800">

  <!-- NAVBAR -->
  <header class="bg-white sticky top-0 z-50 shadow-md">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold text-darkRed">
        <i class="fas fa-truck-fast text-primary"></i> CareConnect <span class="text-primary">Courier</span>
      </a>
      <nav class="hidden md:flex space-x-6 font-medium items-center">
        <a href="index.html" class="hover:text-primary">Home</a>
        <span id="userName" class="text-gray-600"></span>
        <button id="logoutBtn" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-darkRed transition">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </nav>
    </div>
  </header>

  <!-- Dashboard Section -->
  <section class="py-12">
    <div class="container mx-auto px-6">
      <h1 class="text-4xl font-bold mb-2">My Shipments</h1>
      <p class="text-gray-600 mb-8">Track and manage all your shipments in one place</p>

      <!-- Shipments Grid -->
      <div id="shipmentsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <p class="text-gray-500 col-span-full text-center py-8">Loading your shipments...</p>
      </div>
    </div>
  </section>

  <script src="js/dashboard.js"></script>
</body>

</html>
